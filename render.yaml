services:
  - type: web
    name: talentvault-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: ALLOWED_ORIGINS
        value: https://talentvault-frontend.onrender.com
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
    disk:
      name: talentvault-storage
      mountPath: /app/data
      sizeGB: 1
