services:
  - type: web
    name: talentvault-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: talentvault-storage
      mountPath: /app/data
      sizeGB: 1
