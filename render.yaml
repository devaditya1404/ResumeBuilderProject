services:
  - type: web
    name: talentvault-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: ALLOWED_ORIGINS
        value: https://talentvault-frontend.onrender.com
      - key: OLLAMA_MODE
        value: cloud
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: OLLAMA_API_KEY
        sync: false
    disk:
      name: talentvault-storage
      mountPath: /app/data
      sizeGB: 1
